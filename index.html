<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Upload Excel File</title>
    
    <!-- Bootstrap Css -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Local CSS -->
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<div class="container">
    <h3 style="text-align: center;">Upload Excel File</h3>
    <form id="uploadForm">
        <div style="margin-bottom: 10px;">
            <label for="dbName" class="form-label">Database Name</label>
            <input type="text" class="form-control" id="dbName" required>
        </div>
        <div style="margin-bottom: 20px;">
            <label for="excel" class="form-label">Choose Excel File</label>
            <input type="file" class="form-control" id="excel" accept=".xls,.xlsx" required>
        </div>
        <button type="submit" class="btn btn-primary w-50" style="display: block; margin: 0 auto;">Upload</button>
    </form>

    <!-- Display Success/Error Messages -->
    <div id="message" class="mt-3 text-center"></div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
<!-- Local JS -->
<script src="/js/index.js"></script>

</body>
</html>
